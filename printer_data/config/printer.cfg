# ==================================================================================================
# === FILE: printer.cfg
# === PRINTER: RatOS Printer 2
# === SYSTEM: RatOS 2.1 / Klipper
# === VERSION: v1.0 clean
# === PURPOSE: Main Klipper printer configuration with RatOS includes and local overrides
# === NOTES:
# ===   - Cleaned structure only; active values are preserved from the supplied file.
# ===   - Keep custom add-ons in separate files under PGe-Klipper/ when possible.
# ===   - RatOS defaults are loaded first. Everything below [include RatOS.cfg] can override defaults.
# ==================================================================================================


# ==================================================================================================
# === SECTION: RATOS BASE INCLUDES
# === These files load RatOS defaults and shared macros.
# ==================================================================================================
[include RatOS.cfg]
[include macros.cfg]


# ==================================================================================================
# === SECTION: PGE CUSTOM INCLUDES
# === Local add-ons and printer-specific extensions.
# ==================================================================================================
[include PGe-Klipper/all_fan.cfg]
[include PGe-Klipper/Chamber_Filter.cfg]
[include PGe-Klipper/Chamber_Heater.cfg]
[include PGe-Klipper/Led_Control.cfg]
[include PGe-Klipper/Neopixel.cfg]
[include PGe-Klipper/SFS_V2.cfg]
[include PGe-Klipper/Spoolman.cfg]


# ==================================================================================================
# === SECTION: OPTIONAL / DISABLED INCLUDES
# === Leave commented unless you intentionally want to enable the feature.
# ==================================================================================================
#[include PGe-Klipper/bedfans.cfg]
#[include PGe-Klipper/bedfans-dualcontrol.cfg]
#[include PGe-Klipper/brush_nozzle.cfg]
#[include PGe-Klipper/Chamber_Temp.cfg]
#[include PGe-Klipper/Filament_Sensor.cfg]
#[include PGe-Klipper/Neopixel_tank.cfg]


# ==================================================================================================
# === SECTION: SYSTEM INCLUDES
# === Shell commands and timelapse integration.
# ==================================================================================================
[include shell_command.cfg]
[include timelapse.cfg]


# ==================================================================================================
# === SECTION: RATOS MACRO CONFIGURATION
# === Configure the behavior of RatOS start/end/pause macros.
# === Documentation: https://os.ratrig.com/docs/configuration/macros
# ==================================================================================================
[gcode_macro RatOS]
variable_relative_extrusion: False
variable_preheat_extruder: True
variable_preheat_extruder_temp: 170
variable_calibrate_bed_mesh: True
variable_nozzle_priming: "primeline"
variable_nozzle_prime_start_x: "max"
variable_nozzle_prime_start_y: "min"
variable_nozzle_prime_direction: "auto"
variable_start_print_park_in: "front"
variable_start_print_park_z_height: 20
variable_skew_profile: "my_skew"
variable_end_print_park_in: "back"
variable_pause_print_park_in: "front"
variable_macro_travel_speed: 300
variable_adaptive_mesh: True
variable_led_status_action: 0.0, 1.0, 1.0
variable_led_status_success: 0.0, 1.0, 0.0
variable_led_status_error: 1.0, 0.0, 1.0
variable_led_status_on: 1.0, 1.0, 1.0
variable_led_status_off: 0.0, 0.0, 1.0
variable_led_status_standby: 0.1, 0.1, 0.1


# ==================================================================================================
# === SECTION: TELEGRAM / BOT TIMELAPSE DATA
# === Helper variables used by bot/timelapse related macros.
# ==================================================================================================
[gcode_macro _bot_data]
variable_lapse_video_size: 0
variable_lapse_filename: 'None'
variable_lapse_path: 'None'
gcode:
    M118 Setting bot lapse variables


# ==================================================================================================
# === SECTION: MOTION - X AXIS
# === CoreXY A motor, normally rear-left.
# ==================================================================================================
[stepper_x]
dir_pin: x_dir_pin
rotation_distance: 40
homing_speed: 50
position_min: 0
position_max: 200
position_endstop: 0


# ==================================================================================================
# === SECTION: MOTION - Y AXIS
# === CoreXY B motor, normally rear-right.
# ==================================================================================================
[stepper_y]
dir_pin: y_dir_pin
rotation_distance: 40
homing_speed: 50
position_min: 0
position_max: 200
position_endstop: 200


# ==================================================================================================
# === SECTION: MOTION - Z AXIS
# === Three-motor kinematic bed: left, rear, right.
# ==================================================================================================
[stepper_z]
dir_pin: !z0_dir_pin
rotation_distance: 4
homing_speed: 10
position_min: -5
position_max: 200

[stepper_z1]
dir_pin: !z1_dir_pin
rotation_distance: 4

[stepper_z2]
dir_pin: !z2_dir_pin
rotation_distance: 4


# ==================================================================================================
# === SECTION: EXTRUDER
# === Toolhead extruder motor and PID values.
# ==================================================================================================
[extruder]
dir_pin: !e_dir_pin
rotation_distance: 5.57
control: pid
pid_kp: 28.413
pid_ki: 1.334
pid_kd: 151.300


# ==================================================================================================
# === SECTION: HEATED BED
# === Bed heater PID values.
# ==================================================================================================
[heater_bed]
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114


# ==================================================================================================
# === SECTION: KLIPPER HELPERS
# === Common helper modules used by slicers, macros and UI features.
# ==================================================================================================
[respond]

[exclude_object]

[gcode_arcs]
resolution: 0.1


# ==================================================================================================
# === SECTION: PROBE
# === Probe input and Z-offset. z_offset is normally updated by PROBE_CALIBRATE + SAVE_CONFIG.
# ==================================================================================================
[probe]
z_offset: 0.0
pin: ^probe_pin


# ==================================================================================================
# === SECTION: DISPLAY - MKS MINI12864 / BTT MINI12864 STYLE
# === 12864 display with encoder, beeper and RGB backlight.
# ==================================================================================================
[display]
lcd_type: uc1701
cs_pin: PE9
a0_pin: PE10
rst_pin: PE12
contrast: 63
encoder_pins: ^PB2, ^PB1
click_pin: ^!PE7
spi_software_miso_pin: PA6
spi_software_mosi_pin: PA7
spi_software_sclk_pin: PA5

[output_pin beeper]
pin: PE8

[neopixel mks_mini12864]
pin: PE13
chain_count: 3
color_order: RGB
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0


# ==================================================================================================
# === SECTION: SAVE_CONFIG AREA
# === Klipper may append calibrated values below this line after SAVE_CONFIG.
# === Do not manually edit generated SAVE_CONFIG blocks unless you know exactly why.
# ==================================================================================================
